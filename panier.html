<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panier — De L’Ombre à La Lumière</title>
  <link rel="stylesheet" href="assets/css/styles.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌅</text></svg>">
</head>
<body>
  <header class="header">
    <div class="header-inner">
      <a href="index.html" class="logo">
        <svg width="36" height="36" viewBox="0 0 64 64" fill="none"><circle cx="32" cy="32" r="30" stroke="#E9B949" stroke-width="2"/><path d="M32 14C32 14 22 28 22 36C22 41.5228 26.4772 46 32 46C37.5228 46 42 41.5228 42 36C42 28 32 14 32 14Z" fill="#E9B949"/><circle cx="32" cy="36" r="4" fill="#071923"/></svg>
        <span>De L’Ombre à La Lumière</span>
      </a>
      <nav class="nav">
        <a href="index.html">Accueil</a>
        <a href="boutique.html">Boutique</a>
        <a href="a-propos.html">À propos</a>
        <a href="contact.html">Contact</a>
      </nav>
      <div class="header-actions">
        <a href="panier.html" class="cart-btn">🛒 <span class="cart-count" style="display:none">0</span></a>
        <button class="menu-toggle">☰</button>
      </div>
    </div>
    <nav class="mobile-nav">
      <a href="index.html">Accueil</a>
      <a href="boutique.html">Boutique</a>
      <a href="a-propos.html">À propos</a>
      <a href="contact.html">Contact</a>
      <a href="panier.html">Panier</a>
    </nav>
  </header>

  <section class="section">
    <div class="container">
      <h1 class="section-title">Votre panier</h1>

      <div class="cart-layout" id="cart-content">
        <!-- Rempli par JS -->
      </div>
    </div>
  </section>

  <footer class="footer">
    <div class="footer-bottom">
      <p>© 2026 De L’Ombre à La Lumière</p>
    </div>
  </footer>

  <script src="assets/js/products.js"></script>
  <script src="assets/js/cart.js"></script>
  <script src="assets/js/main.js"></script>
  <script>
    function renderCart() {
      const cart = getCart();
      const container = document.getElementById('cart-content');

      if (cart.length === 0) {
        container.innerHTML = `
          <div class="empty-state" style="grid-column:1/-1">
            <p style="font-size:3rem; margin-bottom:1rem;">🛒</p>
            <h2>Votre panier est vide</h2>
            <p>Découvrez nos guides et commencez votre transformation.</p>
            <a href="boutique.html" class="btn btn-primary mt-2">Voir la boutique</a>
          </div>`;
        return;
      }

      const itemsHtml = cart.map(item => `
        <div class="cart-item">
          <div class="cart-item-cover">${item.emoji}</div>
          <div style="flex:1">
            <h3 style="font-size:1.05rem; margin-bottom:0.3rem;">${item.title}</h3>
            <p style="color:var(--or); font-weight:600;">${formatPrice(item.price)}</p>
          </div>
          <button onclick="removeFromCart('${item.id}'); renderCart();" style="background:none; border:none; color:#c00; cursor:pointer; font-size:1.2rem;" aria-label="Supprimer">✕</button>
        </div>
      `).join('');

      const total = getCartTotal();

      container.innerHTML = `
        <div>
          ${itemsHtml}
        </div>
        <div class="cart-summary">
          <h3 style="margin-bottom:1rem;">Récapitulatif</h3>
          <div class="flex justify-between mb-2">
            <span>Sous-total</span>
            <strong>${formatPrice(total)}</strong>
          </div>
          <div class="flex justify-between mb-2" style="font-size:0.9rem; color:var(--gris-clair);">
            <span>Livraison</span>
            <span>Numérique — immédiate</span>
          </div>
          <hr style="margin:1rem 0; border:none; border-top:1px solid #eee;">
          <div class="flex justify-between" style="font-size:1.2rem;">
            <strong>Total</strong>
            <strong style="color:var(--or)">${formatPrice(total)}</strong>
          </div>
          <a href="checkout.html" class="btn btn-primary w-full mt-3">Passer la commande</a>
          <a href="boutique.html" class="btn btn-outline w-full mt-1">Continuer mes achats</a>
          <p class="mt-2" style="font-size:0.8rem; color:var(--gris-clair); text-align:center;">
            Le paiement sécurisé Mobile Money sera bientôt disponible.
          </p>
        </div>
      `;
    }

    document.addEventListener('DOMContentLoaded', renderCart);
  </script>
</body>
</html>
