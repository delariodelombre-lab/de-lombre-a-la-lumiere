<!DOCTYPE html>

  <title>Détail du guide | De L’Ombre à La Lumière</title>

  <style>
    * {

    body {

    .product {

    .cover {
      background: linear-gradient(145deg, #071923, #173747);

    .guide-label {

    h2 {
      color: #a87916;
      font-size: 27px;
      line-height: 1.35;

    }

    .description {
      text-align: left;
      margin: 20px 0;
      overflow-wrap: anywhere;
    }

    .description h3 {
      color: #9a701c;
      font-size: 19px;
      margin-top: 30px;
      margin-bottom: 12px;
      border-bottom: 1px solid #ead9b2;
      padding-bottom: 8px;
    }

    .description h4 {
      color: #173747;

    .highlight {

      border: 1px solid #ead9b2;

    .actions {

    .btn {
      display: inline-block;

    .primary {

    .secondary {

    footer {
      background: #071923;

        font-size: 23px;
      }

      .cover {
        font-size: 62px;
        padding: 28px 12px;
      }

      }

      }

</head>

<body>

  <header>
    <h1>De L’Ombre à La Lumière</h1>
    <p>Spiritualité • Bien-être • Transformation personnelle</p>
  </header>

  <main class="container">
    <div id="product-detail" class="product">
      Chargement du guide...
    </div>
  </main>

  <footer>
    © De L’Ombre à La Lumière — Tous droits réservés.
  </footer>

  <script src="assets/js/products.js"></script>
  <script src="assets/js/main.js"></script>
  <script src="assets/js/cart.js"></script>

  <script>
    // Sécurise l'affichage du texte provenant du catalogue.
    function escapeHTML(text) {
      return String(text).replace(/[&<>"']/g, function(character) {
        return {
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          '"': '&quot;',
          "'": '&#039;'
        }[character];
      });
    }

    // Transforme la description textuelle en une présentation structurée.
    function renderFormattedDescription(text) {
      const lines = String(text || '').split(/\r?\n/);
      let html = '';
      let paragraph = [];
      let list = [];

      function flushParagraph() {
        if (paragraph.length) {
          html += '<p>' + paragraph.map(escapeHTML).join(' ') + '</p>';
          paragraph = [];
        }
      }

      function flushList() {
        if (list.length) {
          html += '<ul>' + list.map(function(item) {
            return '<li>' + escapeHTML(item) + '</li>';
          }).join('') + '</ul>';
          list = [];
        }
      }

      function flushAll() {
        flushParagraph();
        flushList();
      }

      lines.forEach(function(rawLine) {
        const line = rawLine.trim();

        if (!line) {
          flushAll();
          return;
        }

        // Reconnaît les lignes de listes à puces.
        if (/^[•●▪\-]\s*/.test(line)) {
          flushParagraph();
          list.push(line.replace(/^[•●▪\-]\s*/, ''));
          return;
        }

        flushList();

        // Le titre principal du guide.
        if (/^GUIDE\s+\d+\s+—/i.test(line)) {
          flushParagraph();
          html += '<div class="section-heading">' +
            escapeHTML(line) +
            '</div>';
          return;
        }

        // Reconnaît les titres de sections en majuscules.
        const isHeading =
          line === line.toLocaleUpperCase('fr-FR') &&
          /[A-ZÀ-Ÿ]/.test(line) &&
          line.length > 3;

        if (isHeading) {
          flushParagraph();
          html += '<h3>' + escapeHTML(line) + '</h3>';
          return;
        }

        // Reconnaît les titres des chapitres.
        if (/^Chapitre\s+\d+\s+—/i.test(line)) {
          flushParagraph();
          html += '<h4>' + escapeHTML(line) + '</h4>';
          return;
        }

        paragraph.push(line);
      });

      flushAll();

      return html;
    }

    document.addEventListener('DOMContentLoaded', function() {

      const container = document.getElementById('product-detail');
      const params = new URLSearchParams(window.location.search);
      const id = params.get('id');

      const product = getProductById(id);

      if (!product || !product.active) {
        container.innerHTML = `
          <h2>Guide introuvable</h2>
          <p>Ce guide n'est pas disponible actuellement.</p>
          <div class="actions">
            <a href="boutique.html" class="btn secondary">
              Retour à la boutique
            </a>
          </div>
        `;
        return;
      }

      const isGuideOne = product.id === 'guide-transformation';

      const description = isGuideOne
        ? `
          <p><strong>Le premier pas pour mieux comprendre sa vie et retrouver sa direction.</strong></p>

          <p>Avez-vous parfois l'impression de répéter les mêmes erreurs, de rencontrer les mêmes difficultés ou de fournir des efforts sans savoir clairement ce qui vous empêche d'avancer ?</p>

          <p>Avant de chercher à transformer sa vie, il est important d'apprendre à mieux la comprendre.</p>

          <p>Le guide <strong>« La prise de conscience »</strong> vous invite à prendre du recul, à observer votre monde intérieur et à examiner les habitudes, les pensées, les peurs et les croyances qui peuvent influencer vos décisions.</p>

          <p>Ce premier volume de la collection De L’Ombre à La Lumière constitue une base de réflexion pour commencer un travail personnel progressif, lucide et responsable.</p>

          <h3>Ce que vous allez explorer</h3>
          <ul>
            <li>Comprendre vos pensées et vos émotions.</li>
            <li>Identifier certaines habitudes qui freinent votre progression.</li>
            <li>Distinguer les faits de vos interprétations.</li>
            <li>Examiner vos peurs et les croyances qui influencent vos choix.</li>
            <li>Apprendre à prendre vos responsabilités sans vous condamner.</li>
            <li>Clarifier vos valeurs et vos priorités.</li>
            <li>Découvrir une approche spirituelle fondée sur le discernement.</li>
            <li>Transformer progressivement vos prises de conscience en actions concrètes.</li>
          </ul>

          <h3>Un parcours structuré en 4 parties</h3>

          <p><strong>Partie 1 — Le réveil psychologique</strong><br>
          Apprenez à regarder votre situation avec honnêteté et à examiner les pensées qui orientent vos décisions.</p>

          <p><strong>Partie 2 — La rencontre avec soi-même</strong><br>
          Explorez vos peurs, vos contradictions, votre passé et les valeurs qui donnent une direction à votre vie.</p>

          <p><strong>Partie 3 — L'ouverture spirituelle</strong><br>
          Approfondissez votre réflexion sur le silence, la conscience, les racines et le sens de votre vie intérieure.</p>

          <p><strong>Partie 4 — La discipline de transformation</strong><br>
          Découvrez comment passer de la réflexion à l'action et construire des habitudes plus cohérentes avec vos objectifs.</p>

          <h3>Des exercices pour passer à la pratique</h3>

          <p>Ce guide ne se limite pas à des explications. Il vous propose des exercices de réflexion écrite et un programme progressif de 14 jours pour observer votre évolution.</p>

          <p>Vous disposerez notamment :</p>
          <ul>
            <li>D'exercices pour mieux vous connaître.</li>
            <li>De questions pour examiner vos pensées et vos peurs.</li>
            <li>D'un carnet de transformation.</li>
            <li>D'un bilan personnel pour faire le point sur votre parcours.</li>
          </ul>

          <h3>À qui s'adresse ce guide ?</h3>

          <p>À toute personne qui souhaite mieux se comprendre, prendre du recul sur sa situation, examiner ses habitudes et commencer une démarche personnelle de changement.</p>

          <p>Aucune connaissance particulière en psychologie ou en spiritualité n'est nécessaire.</p>

          <div class="highlight">
            <strong>Votre chemin commence par la conscience.</strong>
            <p>Vous n'avez pas besoin de tout changer en un jour. Vous pouvez commencer par observer, comprendre et choisir un premier pas réaliste.</p>
            <p>La prise de conscience ne transforme pas tout instantanément. Elle vous donne une meilleure compréhension de votre point de départ et vous aide à choisir la suite de votre chemin.</p>
          </div>

          <p><em>De L’Ombre à La Lumière — Une collection pour apprendre à se connaître, cultiver sa conscience et transformer progressivement sa vie intérieure.</em></p>
        `
        : `
          <div class="section-intro">
            <strong>${escapeHTML(product.description || '')}</strong>
          </div>

          ${renderFormattedDescription(product.longDescription)}
        `;

      container.innerHTML = `
        <div class="cover">${escapeHTML(product.coverEmoji || '📖')}</div>

        <div style="text-align:center;">
          <span class="guide-label">
            ${isGuideOne ? 'GUIDE 1 — CONNAISSANCE DE SOI' : 'GUIDE 2 — PRÉPARATION INTÉRIEURE'}
          </span>
        </div>

        <h2>${escapeHTML(product.title)}</h2>

        <div class="description">
          ${description}
        </div>

        <div class="price-box">
          <div class="format">Livre numérique au format PDF</div>
          <div class="price">${formatPrice(product.price)}</div>

          <div class="payment-note">
            Après votre demande de commande, les instructions de paiement vous seront communiquées par e-mail. Le guide sera envoyé à votre adresse e-mail après vérification effective du paiement.
          </div>
        </div>

        <div class="actions">
          <button
            class="btn primary"
            data-add-to-cart="${escapeHTML(product.id)}">
            Ajouter au panier
          </button>

          <a href="boutique.html" class="btn secondary">
            Retour à la boutique
          </a>
        </div>
      `;

    });
  </script>

</body>
</html>
